name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[line-extraction]" pytest
      - name: Diagnose Python imports
        run: |
          python - <<'PY'
          import linkoteq_drawing_reconstruction.core_mapper as m
          print("MODULE:", m.__file__)
          print("AcceptedNode:", hasattr(m, "AcceptedNode"))
          print("NAMES:", sorted(x for x in dir(m) if x.startswith("Accepted")))
          PY
      - name: Run test suite
        run: python -m pytest -q
