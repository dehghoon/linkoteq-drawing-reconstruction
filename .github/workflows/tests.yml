name: tests
'on':
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[line-extraction]" pytest

      - name: Prove checked-out mapper bytes
        run: |
          git rev-parse HEAD
          python - <<'PY'
          from pathlib import Path
          p = Path("src/linkoteq_drawing_reconstruction/core_mapper.py")
          print("MAPPER_PATH:", p.resolve())
          text = p.read_text()
          print("HAS_DATACLASS_IMPORT:", "from dataclasses import dataclass" in text)
          print("HAS_BAD_DECORATOR:", "@dataclas(" in text)
          for i, line in enumerate(text.splitlines(), 1):
              if i <= 40:
                  print(f"{i:03d}: {line}")
          PY

      - name: Diagnose Python imports
        run: |
          python - <<'PY'
          import linkoteq_drawing_reconstruction.core_mapper as m
          print("MODULE:", m.__file__)
          print("AcceptedNode:", hasattr(m, "AcceptedNode"))
          print("NAMES:", sorted(x for x in dir(m) if x.startswith("Accepted")))
          PY

      - name: Run test suite
        run: python -m pytest -q

      - name: Checkout Structural Core
        uses: actions/checkout@v4
        with:
          repository: dehghoon/linkoteq-structural-core
          ref: main
          path: .core

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Core dependencies
        working-directory: .core
        run: npm install

      - name: Generate Core contract fixture typecheck
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          model = json.loads(Path("tests/fixtures/core_v0_5_minimal_model.json").read_text())
          source = 'import type { StructuralModel } from "./typescript/index.js";\nconst fixture: StructuralModel = ' + json.dumps(model) + ';\n'
          Path(".core/reconstruction-fixture.ts").write_text(source)
          PY

      - name: Typecheck Core v0.5 fixture
        working-directory: .core
        run: npx tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext reconstruction-fixture.ts
