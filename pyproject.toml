[project]
name = "linkoteq-drawing-reconstruction"
version = "0.1.0"
description = "Structural drawing reconstruction service for Linkoteq"
requires-python = ">=3.11"

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24.0"]
raster = ["numpy>=1.26.0", "opencv-python-headless>=4.9.0"]
line-extraction = ["PyMuPDF>=1.24.0", "numpy>=1.26.0", "opencv-python-headless>=4.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
